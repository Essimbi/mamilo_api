services:
  app:
    image: api-blog_app:latest
    container_name: api-blog_app
    restart: unless-stopped
    env_file: .env.production
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    working_dir: /var/www/html
    expose:
      - "9000"
    depends_on:
      - db
      - redis
    command: ["php-fpm"]

  web:
    image: nginx:1.25-alpine
    container_name: api-blog_web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: api-blog_db
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - dbdata:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: api-blog_redis
    restart: unless-stopped
    expose:
      - "6379"

volumes:
  dbdata:
